services:
  - type: web
    name: gamevault
    runtime: python
    buildCommand: ""
    startCommand: python server.py
    plan: free
    autoDeploy: true
    envVars:
      - key: RAWG_API_KEY
        sync: false
      - key: GAMEVAULT_ADMIN_TOKEN
        generateValue: true
      - key: GAMEVAULT_HOST
        value: 0.0.0.0
      - key: GAMEVAULT_DB
        value: playscape.sqlite3
      - key: GAMEVAULT_CORS_ORIGIN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
